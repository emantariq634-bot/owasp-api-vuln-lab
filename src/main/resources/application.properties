# --- H2 + datasource ---
spring.datasource.url=jdbc:h2:mem:apilab;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA ---
spring.jpa.hibernate.ddl-auto=create-drop

# --- JWT (keep your working values) ---
security.jwt.secret=5b46f0eb3b4b4a7e9c6e1a0f3d2c9b8a5f46e0c1d2e3f4a5b6c7d8e9f0a1b2c3
security.jwt.issuer=apilab
security.jwt.audience=apilab-clients
security.jwt.ttlSeconds=900

# Task 6: Mass Assignment – fail if JSON contains unexpected fields.
spring.jackson.deserialization.fail-on-unknown-properties=true
